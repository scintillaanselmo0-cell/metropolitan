<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metropolitan — Interno 3D (galleria)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#140407;font-family:system-ui,sans-serif}
  #app{position:fixed;inset:0}#app canvas{display:block}
  .tag{position:fixed;top:14px;left:18px;z-index:5;color:#e3bd72;font-size:12px;letter-spacing:.26em;text-transform:uppercase;opacity:.9}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;color:#caa;opacity:.7;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  #load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#140407;color:#7a4a50;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="load">Ricostruzione interno…</div>
<div class="tag">Metropolitan · galleria interna</div>
<div class="hint">trascina per guardarti intorno · scorri per zoom</div>
<div id="app"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const T=THREE;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x120406);
const camera=new T.PerspectiveCamera(55,innerWidth/innerHeight,0.05,300);camera.position.set(-11,2.6,-1.5);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,3,3);controls.enableDamping=true;controls.dampingFactor=.08;
controls.minDistance=2;controls.maxDistance=34;controls.maxPolarAngle=Math.PI*0.52;
const pmrem=new T.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.03).texture;
scene.fog=new T.FogExp2(0x1a0509,0.012);

const M={
  wall:new T.MeshStandardMaterial({color:0x3c0b16,roughness:.9,metalness:0}),
  wall2:new T.MeshStandardMaterial({color:0x320a13,roughness:.92}),
  floor:new T.MeshStandardMaterial({color:0x4a0a12,roughness:.16,metalness:.35,envMapIntensity:1.3}),
  ceil:new T.MeshStandardMaterial({color:0x180810,roughness:.95}),
  frame:new T.MeshStandardMaterial({color:0x101013,roughness:.4,metalness:.85,envMapIntensity:1}),
  day:new T.MeshBasicMaterial({color:0xcad8dc}),
  gold:new T.MeshStandardMaterial({color:0x3a2a10,emissive:0xffb24a,emissiveIntensity:2.4,roughness:.5}),
  red:new T.MeshStandardMaterial({color:0x3a0208,emissive:0xff2233,emissiveIntensity:2.2,roughness:.5}),
  black:new T.MeshStandardMaterial({color:0x0c0c0f,roughness:.32,metalness:.4,envMapIntensity:1}),
  stone:new T.MeshStandardMaterial({color:0x0e0e12,roughness:.25,metalness:.4,envMapIntensity:1.1}),
  stairRed:new T.MeshStandardMaterial({color:0x5a0a12,roughness:.55}),
  crystal:new T.MeshStandardMaterial({color:0x2a1c10,emissive:0xffcf8a,emissiveIntensity:1.6,roughness:.3}),
  glass:new T.MeshPhysicalMaterial({color:0xaac0c8,roughness:.08,metalness:0,transmission:.9,thickness:.4,transparent:true,opacity:.6}),
};
function box(w,h,d,mat,x,y,z,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m;}

const LEN=26, H=8.6, Zf=5, Zb=-5;   // gallery length, height, front(window) wall, back wall
// floor + ceiling
const fl=new T.Mesh(new T.PlaneGeometry(LEN+2,12),M.floor);fl.rotation.x=-Math.PI/2;fl.position.set(0,0,0);fl.receiveShadow=true;scene.add(fl);
const ce=new T.Mesh(new T.PlaneGeometry(LEN+2,12),M.ceil);ce.rotation.x=Math.PI/2;ce.position.set(0,H,0);scene.add(ce);
// back wall + end walls
box(LEN+2,H,0.3,M.wall2,0,H/2,Zb);box(0.3,H,12,M.wall2,-(LEN/2+0.8),H/2,0);box(0.3,H,12,M.wall2,(LEN/2+0.8),H/2,0);

// window wall (burgundy) with arched holes + daylight behind
const nWin=6,bayW=3.7,pilW=0.92,openW=bayW-pilW,X0=-11.1;
const sill=1.2,straightH=4.0,r=openW/2,archBaseY=sill+straightH,archTopY=archBaseY+r;
const centers=[];for(let i=0;i<nWin;i++)centers.push(X0+bayW/2+i*bayW);
function archShape(w,h,rad){const s=new T.Shape(),hw=w/2;s.moveTo(-hw,0);s.lineTo(-hw,h);s.absarc(0,h,hw,Math.PI,0,true);s.lineTo(hw,0);s.lineTo(-hw,0);return s;}
const wallShape=new T.Shape();wallShape.moveTo(-(LEN/2+1),0);wallShape.lineTo(LEN/2+1,0);wallShape.lineTo(LEN/2+1,H);wallShape.lineTo(-(LEN/2+1),H);wallShape.lineTo(-(LEN/2+1),0);
centers.forEach(cx=>{const h=archShape(openW,straightH,r);const pts=h.getPoints(60).map(p=>new T.Vector2(p.x+cx,p.y+sill));wallShape.holes.push(new T.Path(pts));});
const wallMesh=new T.Mesh(new T.ShapeGeometry(wallShape),new T.MeshStandardMaterial({color:0x3c0b16,roughness:.9,side:T.DoubleSide}));wallMesh.position.z=Zf;scene.add(wallMesh);
// daylight plane behind window wall
const day=new T.Mesh(new T.PlaneGeometry(LEN+2,H),M.day);day.position.set(0,H/2,Zf+0.5);scene.add(day);

// per-window: black grid frame + gold LED arch outline
function tubeFromShape(shape,cx,z,rad,mat){const pts=shape.getPoints(80).map(p=>new T.Vector3(p.x+cx,p.y+sill,z));const curve=new T.CatmullRomCurve3(pts,true);const g=new T.TubeGeometry(curve,160,rad,8,true);return new T.Mesh(g,mat);}
centers.forEach(cx=>{
  // frame ring
  const outer=archShape(openW,straightH,r),hole=archShape(openW-0.26,straightH-0.13,r-0.13);
  outer.holes.push(new T.Path(hole.getPoints(44).reverse().map(p=>new T.Vector2(p.x,p.y))));
  const fr=new T.Mesh(new T.ExtrudeGeometry(outer,{depth:0.12,bevelEnabled:false}),M.frame);fr.position.set(cx,sill,Zf-0.12);scene.add(fr);
  // mullions
  const hw=openW/2;
  for(let dx=-hw+0.5;dx<hw-0.1;dx+=0.55){const top=(dx>-r&&dx<r)?(straightH+Math.sqrt(Math.max(0,r*r-dx*dx))):straightH;box(0.05,top-0.02,0.06,M.frame,cx+dx,sill+(top-0.02)/2,Zf-0.05);}
  for(let y=0.6;y<straightH;y+=0.62)box(openW-0.14,0.05,0.06,M.frame,cx,sill+y,Zf-0.05);
  // gold LED arch outline (the glowing reveal)
  const ledShape=archShape(openW+0.34,straightH+0.17,r+0.17);
  scene.add(tubeFromShape(ledShape,cx,Zf-0.18,0.05,M.gold));
});
// warm cove along ceiling (front + back)
box(LEN,0.08,0.08,M.gold,0,H-0.25,Zf-0.4);box(LEN,0.08,0.08,M.gold,0,H-0.25,Zb+0.4);

// black panther statues (stylized, sitting) at each window base
function panther(cx){const g=new T.Group();g.position.set(cx,0,Zf-0.9);
  box(0.9,0.2,0.6,M.black,0,0.1,0,g);                               // base/haunches
  const body=new T.Mesh(new T.SphereGeometry(0.42,20,16),M.black);body.scale.set(1,1.3,0.8);body.position.set(0,0.75,0.05);g.add(body);
  const chest=new T.Mesh(new T.CylinderGeometry(0.16,0.28,1.0,16),M.black);chest.position.set(0,0.65,0.3);chest.rotation.x=0.25;g.add(chest);
  const head=new T.Mesh(new T.SphereGeometry(0.24,18,14),M.black);head.position.set(0,1.25,0.42);g.add(head);
  box(0.1,0.1,0.14,M.black,-0.1,1.45,0.42,g);box(0.1,0.1,0.14,M.black,0.1,1.45,0.42,g); // ears
  const front=new T.Mesh(new T.CylinderGeometry(0.1,0.1,0.75,12),M.black);front.position.set(0.0,0.38,0.52);g.add(front);
  g.traverse(o=>o.castShadow=true);scene.add(g);}
centers.forEach(panther);

// chandeliers (clusters of warm crystals)
function chandelier(x,z){const g=new T.Group();g.position.set(x,0,z);
  box(0.03,1.4,0.03,M.black,0,H-0.7,0,g);
  for(let i=0;i<26;i++){const a=i/26*Math.PI*2,ry=0.5+Math.random()*0.5,rr=0.3+0.5*Math.random();
    const c=new T.Mesh(new T.OctahedronGeometry(0.06+Math.random()*0.05),M.crystal);
    c.position.set(Math.cos(a)*rr,H-1.0-ry,Math.sin(a)*rr);g.add(c);}
  const pl=new T.PointLight(0xffcf8a,1.2,10,2);pl.position.set(0,H-1.4,0);g.add(pl);scene.add(g);}
chandelier(-6,0.6);chandelier(6,0.6);

// bar counter (black marble) with red underglow
(function(){const bx=-9.5,bz=-2.6;box(5,1.15,1.4,M.stone,bx,0.58,bz);box(5.3,0.12,1.7,M.stone,bx,1.2,bz);
  box(4.6,0.14,1.0,M.red,bx,0.12,bz);                       // red underglow strip near floor
  const pl=new T.PointLight(0xff2233,2,7,2);pl.position.set(bx,0.4,bz+0.9);scene.add(pl);})();

// side staircase (red steps, black risers) rising at the +x back corner, glass balustrade
(function(){const sx=9.0,sz=-2.2,n=10,rise=0.32,run=0.42;const g=new T.Group();
  for(let i=0;i<n;i++){box(2.2,0.14,run,M.stairRed,sx,i*rise+0.07,sz-i*run);box(2.2,rise,0.06,M.black,sx,i*rise-rise/2+0.07,sz-i*run+run/2);}
  // handrail + warm underline + glass
  const hr=new T.Mesh(new T.BoxGeometry(0.08,0.08,n*run*1.42),M.black);hr.position.set(sx+1.0,n*rise*0.5+0.9,sz-n*run/2);hr.rotation.x=Math.atan2(rise,run);scene.add(hr);
  const led=new T.Mesh(new T.BoxGeometry(0.05,0.05,n*run*1.42),M.gold);led.position.set(sx+1.0,n*rise*0.5+0.55,sz-n*run/2);led.rotation.x=Math.atan2(rise,run);scene.add(led);
  const gl=new T.Mesh(new T.BoxGeometry(0.03,0.9,n*run*1.42),M.glass);gl.position.set(sx+1.0,n*rise*0.5+0.45,sz-n*run/2);gl.rotation.x=Math.atan2(rise,run);scene.add(gl);
})();

// a few black ottomans + feather plumes
function lounge(x,z){const o=new T.Mesh(new T.CylinderGeometry(0.5,0.5,0.9,20),M.black);o.position.set(x,0.45,z);o.castShadow=true;scene.add(o);
  box(0.04,1.4,0.04,M.black,x+0.7,0.7,z);const pl=new T.Mesh(new T.SphereGeometry(0.4,12,10),new T.MeshStandardMaterial({color:0xefe9dd,roughness:.9}));pl.scale.set(1,0.7,1);pl.position.set(x+0.7,1.5,z);scene.add(pl);}
lounge(-3,-2.5);lounge(2.5,-2.8);

// lights
scene.add(new T.AmbientLight(0x3a1016,0.5));
const warm=new T.PointLight(0xffb267,1.4,30,2);warm.position.set(0,7,0);scene.add(warm);
const red=new T.PointLight(0xff2a2a,0.6,34,2);red.position.set(0,2,-3);scene.add(red);
const key=new T.DirectionalLight(0xffd9b0,0.5);key.position.set(-6,10,8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
const sc=key.shadow.camera;sc.left=-16;sc.right=16;sc.top=10;sc.bottom=-2;sc.near=1;sc.far=60;scene.add(key);

// post
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),0.75,0.6,0.55));
composer.addPass(new OutputPass());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
document.getElementById('load').style.display='none';
(function loop(){requestAnimationFrame(loop);controls.update();composer.render();})();
</script>
</body>
</html>
