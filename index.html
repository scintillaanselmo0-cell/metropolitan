<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teatro Metropolitan — Esperienza 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1a1a;--red:#e01328;--red2:#ff2a3c;--bone:#f3efe7}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f4f2ec;color:var(--ink);font-family:'Jost',sans-serif}
  #scroller{height:640vh}
  #stage{position:fixed;inset:0;z-index:0}#stage canvas{display:block}
  .top{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:center;
    padding:24px 40px;color:#fff;mix-blend-mode:difference}
  .brand{font-family:'Anton';font-size:20px;letter-spacing:.3em;text-transform:uppercase}
  nav{display:flex;gap:28px;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
  nav a{color:#fff;text-decoration:none;opacity:.85}
  @media(max-width:760px){nav{display:none}.top{padding:18px 20px}}
  .panel{position:fixed;left:0;right:0;z-index:3;text-align:center;padding:0 24px;pointer-events:none;opacity:0;transition:opacity .55s ease}
  .panel.show{opacity:1}
  .p-hero{bottom:11vh;color:var(--ink)}
  .p-mid{top:50%;transform:translateY(-50%);color:var(--ink)}
  .p-end{top:50%;transform:translateY(-50%);color:var(--bone)}
  .kicker{font-size:12px;letter-spacing:.56em;text-transform:uppercase;margin-bottom:18px;font-weight:500}
  .p-hero .kicker,.p-mid .kicker{color:#555}
  .p-end .kicker{color:var(--red2);text-shadow:0 0 24px rgba(224,19,40,.7)}
  h1{font-family:'Anton';font-size:clamp(46px,10vw,132px);line-height:.9;text-transform:uppercase;letter-spacing:.02em}
  .p-end .r{color:var(--red2);text-shadow:0 0 50px rgba(255,42,60,.5)}
  .big{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(34px,6vw,74px)}
  .sub{margin-top:18px;font-weight:300;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;opacity:.85}
  .cta{margin-top:30px;display:inline-block;padding:15px 40px;border:1px solid var(--red);color:var(--bone);text-decoration:none;
    font-size:12px;letter-spacing:.24em;text-transform:uppercase;pointer-events:auto;background:rgba(224,19,40,.12)}
  .cue{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:4;font-size:11px;letter-spacing:.3em;
    text-transform:uppercase;color:#555;opacity:.75;transition:opacity .4s}
  #load{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#f4f2ec;color:#9a968d;
    font:400 13px 'Anton';letter-spacing:.35em;text-transform:uppercase;transition:opacity .8s}
</style>
</head>
<body>
<div id="load">Caricamento</div>
<div id="stage"></div>
<header class="top"><div class="brand">Metropolitan</div>
  <nav><a href="#">Stagione</a><a href="#">Il teatro</a><a href="#">Biglietteria</a><a href="#">Contatti</a></nav></header>

<div class="panel p-hero show" id="pHero">
  <div class="kicker">Aversa sotto i riflettori</div>
  <h1>Teatro<br>Metropolitan</h1>
  <p class="sub">Scorri ed entra.</p>
</div>
<div class="panel p-mid" id="pMid"><div class="big">Varca la soglia.</div></div>
<div class="panel p-end" id="pEnd">
  <div class="kicker">Stagione 2026 / 2027</div>
  <div class="big">La stagione sta<br><span class="r">per cominciare</span></div>
  <a class="cta" href="#">Scopri il cartellone</a>
</div>
<div class="cue" id="cue">Scorri</div>
<div id="scroller"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE;
const scene=new T.Scene();
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.getElementById('stage').appendChild(renderer.domElement);
const FOV=40;
const camera=new T.PerspectiveCamera(FOV,innerWidth/innerHeight,0.05,500);
scene.background=new T.Color(0xf4f2ec);
scene.fog=new T.FogExp2(0xece9e2,0.005);

const M={
  wall:new T.MeshStandardMaterial({color:0xf1efe8,roughness:.95}),
  white:new T.MeshStandardMaterial({color:0xf7f5ef,roughness:.85}),
  frame:new T.MeshStandardMaterial({color:0xb3b0a8,roughness:.5,metalness:.2}),
  awning:new T.MeshStandardMaterial({color:0x141414,roughness:.4,metalness:.3}),
  plinth:new T.MeshStandardMaterial({color:0xb8b5ad,roughness:.6}),
  marble:new T.MeshStandardMaterial({color:0xefece6,roughness:.6}),
  glass:new T.MeshStandardMaterial({color:0xdde6e8,roughness:.1,metalness:.3,transparent:true,opacity:.5}),
  // interior
  idark:new T.MeshStandardMaterial({color:0x14101a,roughness:.95}),
  curtain:new T.MeshStandardMaterial({color:0x6e0512,roughness:.85,emissive:0xb0101f,emissiveIntensity:.9}),
};
function box(w,h,d,mat,x,y,z,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m;}
function glowSprite(size,color,op){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);
  const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),blending:T.AdditiveBlending,depthWrite:false,transparent:true,opacity:op}));s.scale.set(size,size,1);return s;}

// ---------- facade (symmetric, centered on x=0) ----------
const nWin=6,bayW=3.7,pilW=0.92,openW=bayW-pilW;
const X0=-11.1,sillY=0.5,straightH=5.6,r=openW/2;
const archBaseY=sillY+straightH,archTopY=archBaseY+r,GF_H=8.4;
const centers=[];for(let i=0;i<nWin;i++)centers.push(X0+bayW/2+i*bayW);
const ENTRYX=centers[3]; // 1.85
const facade=new T.Group();scene.add(facade);
for(let i=0;i<=nWin;i++){const x=X0+i*bayW;box(pilW,GF_H,0.7,M.wall,x,GF_H/2,0);}
box(4.3,GF_H,0.55,M.wall,-13.9,GF_H/2,-0.07);box(4.3,GF_H,0.55,M.wall,13.9,GF_H/2,-0.07); // symmetric end panels
box(32.5,GF_H-archTopY,0.5,M.wall,0,(archTopY+GF_H)/2,-0.02);
box(33,0.35,7,M.marble,0,0.0,1.2);
function archShape(w,h,rad){const s=new T.Shape(),hw=w/2;s.moveTo(-hw,0);s.lineTo(-hw,h);s.absarc(0,h,hw,Math.PI,0,true);s.lineTo(hw,0);s.lineTo(-hw,0);return s;}
const entryGlass=[];
function window3D(cx){const g=new T.Group();g.position.set(cx,sillY,0);facade.add(g);
  box(openW+0.12,sillY+0.02,0.55,M.plinth,0,-sillY/2,0,g);
  const glass=new T.Mesh(new T.ShapeGeometry(archShape(openW-0.2,straightH-0.1,r-0.1)),M.glass.clone());glass.position.z=-0.06;g.add(glass);
  if(Math.abs(cx-ENTRYX)<0.01)entryGlass.push(glass);
  const outer=archShape(openW,straightH,r),hole=archShape(openW-0.22,straightH-0.11,r-0.11);
  outer.holes.push(new T.Path(hole.getPoints(44).reverse().map(p=>new T.Vector2(p.x,p.y))));
  const fr=new T.Mesh(new T.ExtrudeGeometry(outer,{depth:0.18,bevelEnabled:false}),M.frame);fr.position.z=-0.02;g.add(fr);
  const hw=openW/2;
  for(let dx=-hw+0.42;dx<hw-0.08;dx+=0.46){const top=(dx>-r&&dx<r)?(archBaseY-sillY+Math.sqrt(Math.max(0,r*r-dx*dx))):straightH;box(0.055,top-0.02,0.1,M.frame,dx,(top-0.02)/2,0.07,g);}
  for(let y=0.6;y<straightH-0.25;y+=0.6)box(openW-0.14,0.055,0.1,M.frame,0,y,0.07,g);
}
centers.forEach(window3D);
centers.forEach(cx=>{const m=new T.Mesh(new T.SphereGeometry(1,30,18,0,Math.PI*2,0,Math.PI*0.5),M.awning);m.scale.set(r+0.12,0.82,0.95);m.position.set(cx,archTopY-0.05,0.5);m.castShadow=true;facade.add(m);
  const rib=new T.Mesh(new T.TorusGeometry(1,0.02,6,30,Math.PI),new T.MeshStandardMaterial({color:0x2c2c2c,roughness:.4}));rib.scale.set(r+0.12,0.82,0.95);rib.rotation.x=Math.PI/2;rib.position.set(cx,archTopY-0.05,0.5);facade.add(rib);});
box(33,0.7,1.7,M.white,0,GF_H+0.35,0.6);box(33,0.14,1.8,M.white,0,GF_H+0.72,0.64);
const UP_Y=GF_H+0.7,UP_H=5.4,upZ=-0.3;box(31.5,UP_H,0.55,M.wall,0,UP_Y+UP_H/2,upZ);box(32,0.4,0.8,M.white,0,UP_Y+UP_H+0.12,upZ);
[-8,0,8].forEach(x=>{box(2.6,2.9,0.22,M.frame,x,UP_Y+2.1,upZ+0.2);box(3.2,0.16,0.9,M.white,x,UP_Y+0.55,upZ+0.7);
  box(3.2,0.06,0.06,M.white,x,UP_Y+1.55,upZ+1.05);for(let bx=-1.5;bx<=1.5;bx+=0.24)box(0.035,1.0,0.035,M.white,x+bx,UP_Y+1.05,upZ+1.05);});
(function(){const CW=1024,CH=330;const c=document.createElement('canvas');c.width=CW;c.height=CH;const g=c.getContext('2d');
  g.fillStyle='#101010';g.textAlign='center';g.textBaseline='alphabetic';
  g.font='600 60px Georgia,serif';g.fillText('TEATRO',CW/2,110);
  let fs=150;g.font='600 '+fs+'px Georgia,serif';const w=g.measureText('METROPOLITAN').width;
  if(w>960){fs=Math.floor(fs*960/w);g.font='600 '+fs+'px Georgia,serif';}
  g.fillText('METROPOLITAN',CW/2,270);
  const tx=new T.CanvasTexture(c);tx.anisotropy=8;
  const p=new T.Mesh(new T.PlaneGeometry(3.9,3.9*CH/CW),new T.MeshStandardMaterial({map:tx,transparent:true,roughness:.7}));p.position.set(13.9,5.3,0.24);facade.add(p);})();
for(let i=0;i<5;i++)box(22+i*2.0,0.3,1.0,M.marble,0,0.15-i*0.3,1.6+i*1.0);
const gp=new T.Mesh(new T.PlaneGeometry(400,400),M.marble);gp.rotation.x=-Math.PI/2;gp.position.y=-0.95;gp.receiveShadow=true;scene.add(gp);

// ---------- interior: red lives here ----------
const IN=new T.Group();scene.add(IN);
box(26,0.4,40,M.idark,0,-0.2,-20,IN);box(26,0.4,40,M.idark,0,GF_H+1,-20,IN);
box(0.4,GF_H+2,40,M.idark,-13,GF_H/2,-20,IN);box(0.4,GF_H+2,40,M.idark,13,GF_H/2,-20,IN);
box(26,GF_H+2,0.6,M.idark,0,GF_H/2,-39.7,IN);
box(14,1.2,1,M.white,0,7.4,-37,IN);box(1.2,8,1,M.white,-6,4,-37,IN);box(1.2,8,1,M.white,6,4,-37,IN);
box(12,8,0.4,M.curtain,0,4,-38.2,IN);
const stageGlow=glowSprite(26,'rgba(255,40,55,.8)',.9);stageGlow.position.set(0,5,-37);scene.add(stageGlow);
for(let x=-5;x<=5;x+=1.4){const pl=new T.PointLight(0xff2436,0.9,16,2);pl.position.set(x,0.6,-34);IN.add(pl);}
const haze=glowSprite(30,'rgba(230,20,40,.5)',.5);haze.position.set(0,5,-26);scene.add(haze);

// ---------- lights: soft white exterior ----------
scene.add(new T.HemisphereLight(0xffffff,0xd8d4cc,0.85));
scene.add(new T.AmbientLight(0xffffff,0.45));
const key=new T.DirectionalLight(0xfff3e4,1.05);key.position.set(-18,24,28);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);const sc=key.shadow.camera;sc.left=-28;sc.right=28;sc.top=30;sc.bottom=-6;sc.near=1;sc.far=130;scene.add(key);
const fill=new T.DirectionalLight(0xdfe6f0,0.35);fill.position.set(20,12,16);scene.add(fill);
const stageKey=new T.SpotLight(0xff5a66,3.2,40,0.5,0.6);stageKey.position.set(0,12,-30);stageKey.target.position.set(0,4,-38);scene.add(stageKey);scene.add(stageKey.target);

// ---------- scroll journey ----------
const yc=6.8, FRAME_HALF=16.7;
const K=[
 {p:0.00,pos:[0,yc,30],       look:[0,yc,0]},       // frontal (z set responsively)
 {p:0.30,pos:[ENTRYX*0.5,5.6,15], look:[ENTRYX*0.5,5.3,0]},
 {p:0.54,pos:[ENTRYX,5,8],    look:[ENTRYX,5,-4]},
 {p:0.72,pos:[ENTRYX,4.8,2],  look:[ENTRYX,4.8,-12]},
 {p:0.86,pos:[ENTRYX*0.4,5,-7],look:[0,5,-22]},
 {p:1.00,pos:[0,5.4,-16],     look:[0,5.2,-36]},
];
function computeStart(){const asp=innerWidth/innerHeight;const z=FRAME_HALF/(Math.tan(FOV*Math.PI/360)*asp);K[0].pos[2]=Math.max(18,z);}
const sm=(a,b,t)=>{t=(t-a)/(b-a);t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);};
function sample(p){let i=0;while(i<K.length-1&&p>K[i+1].p)i++;const A=K[i],B=K[Math.min(i+1,K.length-1)];
  const t=A.p===B.p?0:sm(A.p,B.p,p);const L=(u,v)=>u+(v-u)*t;
  return{pos:[L(A.pos[0],B.pos[0]),L(A.pos[1],B.pos[1]),L(A.pos[2],B.pos[2])],look:[L(A.look[0],B.look[0]),L(A.look[1],B.look[1]),L(A.look[2],B.look[2])]};}

let targetP=0,curP=0;
function onScroll(){const h=document.getElementById('scroller').offsetHeight-innerHeight;targetP=Math.max(0,Math.min(1,scrollY/h));}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);computeStart();});
const pHero=pHeroEl(),pMid=document.getElementById('pMid'),pEnd=document.getElementById('pEnd'),cue=document.getElementById('cue');
function pHeroEl(){return document.getElementById('pHero');}
function panels(p){pHero.classList.toggle('show',p<0.16);pMid.classList.toggle('show',p>0.36&&p<0.5);pEnd.classList.toggle('show',p>0.9);cue.style.opacity=p<0.05?0.75:0;}
function frame(){
  curP+=(targetP-curP)*0.06;
  const s=sample(curP);
  camera.position.set(s.pos[0],s.pos[1],s.pos[2]);
  camera.lookAt(s.look[0],s.look[1],s.look[2]);
  if(entryGlass[0])entryGlass[0].material.opacity=Math.max(0.08,0.5-curP*0.9);
  panels(curP);renderer.render(scene,camera);requestAnimationFrame(frame);
}
computeStart();onScroll();frame();
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),800);},500);
</script>
</body>
</html>
